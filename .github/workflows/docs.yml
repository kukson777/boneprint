name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs load the module from src/, whose tsconfig extends the generated .nuxt/tsconfig.json
      - run: pnpm exec nuxt-module-build prepare

      - run: pnpm docs:build
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /boneprint/
          # The origin only: agent discovery rejects a path, the base URL adds /boneprint/
          NUXT_SITE_URL: https://kukson777.github.io

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
